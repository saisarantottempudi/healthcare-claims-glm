name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ── Lint ────────────────────────────────────────────────────────────────────
  lint:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check syntax (py_compile)
        run: |
          find src scripts tests -name "*.py" | xargs python -m py_compile

  # ── Tests ───────────────────────────────────────────────────────────────────
  test:
    name: Test suite
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Generate data
        run: python scripts/generate_data.py

      - name: Train models
        run: python scripts/train.py

      - name: Run tests with coverage
        run: |
          pytest tests/ -v \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            --tb=short

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

  # ── Evaluate ─────────────────────────────────────────────────────────────────
  evaluate:
    name: Model evaluation
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Generate data + train
        run: |
          python scripts/generate_data.py
          python scripts/train.py

      - name: Run evaluation
        run: python scripts/evaluate.py

      - name: Upload figures
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-figures
          path: reports/figures/*.png

  # ── Docker build check ──────────────────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Generate data + train (needed for model artifacts in image)
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install + train
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          python scripts/generate_data.py
          python scripts/train.py

      - name: Build Docker image
        run: docker build -t healthcare-claims-glm:ci .

      - name: Smoke test Docker image
        run: |
          docker run -d -p 8000:8000 --name glm-api healthcare-claims-glm:ci
          sleep 15
          curl -f http://localhost:8000/health
          docker stop glm-api

version: "3.9"

services:
  api:
    build:
      context: .
      target: runtime
    image: healthcare-claims-glm:latest
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro        # mount trained model artifacts
      - ./mlruns:/app/mlruns:ro        # optional: mount MLflow runs
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.22.0
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlflow/mlruns
    command: >
      mlflow server
        --backend-store-uri /mlflow/mlruns
        --default-artifact-root /mlflow/mlruns
        --host 0.0.0.0
        --port 5000
    restart: unless-stopped
